<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" role="img" aria-label="读时钟的两问两答时序">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker>
  </defs>
  <style>
    .h{font-size:15px;font-weight:600;fill:#111827;text-anchor:middle}
    .n{font-size:15px;font-weight:600;fill:#111827;text-anchor:middle}
    .d{font-size:13.5px;fill:#374151;text-anchor:middle}
    .p{font-size:14px;font-weight:600;text-anchor:middle}
    .ar{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#a)}
    .life{stroke:#9ca3af;stroke-width:1.5;stroke-dasharray:5 4}
  </style>
  <rect x="1" y="1" width="878" height="368" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <rect x="20" y="78" width="840" height="125" rx="8" fill="#fef3c7"/>
  <rect x="20" y="215" width="840" height="125" rx="8" fill="#dcfce7"/>
