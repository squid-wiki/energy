  <text class="p" x="85" y="158" fill="#b45309">建立连接</text>
  <text class="p" x="85" y="273" fill="#15803d">第 2 组</text>
  <text class="p" x="85" y="295" fill="#15803d">读取数据</text>

  <rect x="150" y="20" width="170" height="44" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
