<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" role="img" aria-label="DLMS/COSEM 协议栈：数据模型、应用层，以及三种通信配置">
  <style>
    .h{font-size:15.5px;font-weight:600;fill:#111827}
    .t{font-size:13.5px;fill:#374151}
    .c{font-size:14px;font-weight:600;fill:#111827;text-anchor:middle}
    .s{font-size:12.5px;fill:#374151;text-anchor:middle}
    .a{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}
    .g{fill:#dcfce7;stroke:#15803d;stroke-width:1.5}
    .w{fill:#ffffff;stroke:#15803d;stroke-width:1.2}
    .b{fill:#dbeafe;stroke:#2563eb;stroke-width:1.5}
  </style>
  <rect x="1" y="1" width="878" height="558" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <rect class="b" x="30" y="20" width="820" height="52" rx="8"/>
  <text class="h" x="50" y="52">OBIS</text><text class="t" x="170" y="52">给数据起名字，例如 1-0:1.8.0.255 表示总正向有功电量</text>
  <rect class="b" x="30" y="80" width="820" height="52" rx="8"/>
  <text class="h" x="50" y="112">COSEM 模型</text><text class="t" x="170" y="112">规定数据的结构：Register、Profile generic、Clock ……</text>

  <rect class="g" x="30" y="146" width="820" height="186" rx="8"/>
  <text class="h" x="50" y="174">应用层</text><text class="t" x="110" y="174">所有通信方式共用这一层</text>
  <rect class="a" x="50" y="188" width="380" height="62" rx="6"/><text class="c" x="240" y="212">ACSE：建立、释放连接</text><text class="s" x="240" y="236">AARQ、AARE、RLRQ</text>
  <rect class="w" x="450" y="188" width="380" height="62" rx="6"/><text class="c" x="640" y="212">xDLMS：操作对象</text><text class="s" x="640" y="236">GET、SET、ACTION、事件通知</text>
  <rect class="w" x="50" y="258" width="380" height="62" rx="6"/><text class="c" x="240" y="282">安全</text><text class="s" x="240" y="306">认证、加密、密钥处理</text>
  <rect class="w" x="450" y="258" width="380" height="62" rx="6"/><text class="c" x="640" y="282">编码</text><text class="s" x="640" y="306">ACSE 用 BER，xDLMS 用 A-XDR</text>

  <!-- 通信配置 -->
  <rect class="g" x="30" y="346" width="265" height="166" rx="8"/>
  <text class="c" x="162" y="372">三层串行配置</text>
  <rect class="w" x="46" y="386" width="233" height="50" rx="6"/><text class="c" x="162" y="416">HDLC 数据链路</text>
  <rect class="a" x="46" y="444" width="233" height="54" rx="6"/><text class="s" x="162" y="476">RS-232、RS-485、光口</text>

  <rect class="g" x="307" y="346" width="265" height="166" rx="8"/>
  <text class="c" x="439" y="372">IP 配置</text>
  <rect class="w" x="323" y="386" width="233" height="36" rx="6"/><text class="c" x="439" y="409">Wrapper 或 HDLC</text>
  <rect class="a" x="323" y="428" width="233" height="32" rx="6"/><text class="s" x="439" y="449">TCP 或 UDP，IPv4 或 IPv6</text>
  <rect class="a" x="323" y="466" width="233" height="32" rx="6"/><text class="s" x="439" y="487">GPRS、LTE、以太网</text>

  <rect class="g" x="585" y="346" width="265" height="166" rx="8"/>
  <text class="c" x="717" y="372">电力线载波（PLC）配置</text>
  <rect class="w" x="601" y="386" width="233" height="50" rx="6"/><text class="c" x="717" y="416">LLC + MAC</text>
  <rect class="a" x="601" y="444" width="233" height="54" rx="6"/><text class="s" x="717" y="476">S-FSK、G3、PRIME，电力线</text>

  <rect class="b" x="170" y="526" width="18" height="18" rx="3"/><text class="t" x="194" y="540">COSEM（蓝皮书）</text>
  <rect class="g" x="360" y="526" width="18" height="18" rx="3"/><text class="t" x="384" y="540">DLMS（绿皮书）</text>
  <rect class="a" x="540" y="526" width="18" height="18" rx="3"/><text class="t" x="564" y="540">沿用或外部技术</text>
</svg>
