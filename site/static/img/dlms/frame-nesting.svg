<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" role="img" aria-label="一条报文由 Wrapper 头和 APDU 组成">
  <style>
    .h{font-size:15.5px;font-weight:600;fill:#111827;text-anchor:middle}
    .t{font-size:13.5px;fill:#374151;text-anchor:middle}
    .m{font-family:Consolas,Menlo,monospace;font-size:15px;font-weight:600;fill:#111827;text-anchor:middle}
    .g{fill:#dcfce7;stroke:#15803d;stroke-width:1.5}
    .b{fill:#dbeafe;stroke:#2563eb;stroke-width:1.5}
    .l{stroke:#9ca3af;stroke-width:1.2;stroke-dasharray:4 3;fill:none}
  </style>
  <rect x="1" y="1" width="878" height="298" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <rect class="g" x="40" y="26" width="240" height="72" rx="8"/>
  <text class="h" x="160" y="55">Wrapper 头（8 字节）</text>
  <text class="t" x="160" y="79">相当于快递单</text>
  <rect class="g" x="290" y="26" width="550" height="72" rx="8"/>
  <text class="h" x="565" y="55">APDU（应用层消息）</text>
  <text class="t" x="565" y="79">相当于包裹里的东西：AARQ、AARE、GET 请求或响应</text>

  <path class="l" d="M40 98 L40 150"/>
  <path class="l" d="M280 98 L448 150"/>
  <path class="l" d="M290 98 L470 150"/>
  <path class="l" d="M840 98 L840 150"/>

  <rect class="g" x="40" y="150" width="96" height="76" rx="6"/><text class="m" x="88" y="180">00 01</text><text class="t" x="88" y="207">版本</text>
  <rect class="g" x="144" y="150" width="96" height="76" rx="6"/><text class="m" x="192" y="180">00 10</text><text class="t" x="192" y="207">谁发的</text>
  <rect class="g" x="248" y="150" width="96" height="76" rx="6"/><text class="m" x="296" y="180">00 01</text><text class="t" x="296" y="207">发给谁</text>
  <rect class="g" x="352" y="150" width="96" height="76" rx="6"/><text class="m" x="400" y="180">00 0D</text><text class="t" x="400" y="207">后面多长</text>

  <rect class="g" x="470" y="150" width="96" height="76" rx="6"/><text class="m" x="518" y="180">C0 01 C1</text><text class="t" x="518" y="207">做什么</text>
  <rect class="b" x="574" y="150" width="190" height="76" rx="6"/><text class="m" x="669" y="180">00 08 … FF 02</text><text class="t" x="669" y="207">对谁做：类 ID + OBIS + 属性</text>
  <rect class="g" x="772" y="150" width="68" height="76" rx="6"/><text class="m" x="806" y="180">00</text><text class="t" x="806" y="207">选项</text>

  <text x="440" y="268" text-anchor="middle" font-size="15" fill="#111827">以 GET 请求为例：换 APDU 的内容，Wrapper 头的结构不变</text>
</svg>
