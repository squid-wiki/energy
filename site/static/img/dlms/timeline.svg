<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" role="img" aria-label="DLMS/COSEM 从 1996 年到 2026 年的发展时间线">
  <style>
    .y{font-size:16px;font-weight:700;text-anchor:middle;fill:#1e3a8a}
    .t{font-size:13.5px;fill:#374151;text-anchor:middle}
    .l{stroke:#9ca3af;stroke-width:1.2}
    .d{fill:#2563eb;stroke:#ffffff;stroke-width:2}
  </style>
  <rect x="1" y="1" width="878" height="308" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="30" y="151" width="820" height="6" rx="3" fill="#bfdbfe"/>

  <line class="l" x1="85" y1="154" x2="85" y2="108"/><circle class="d" cx="85" cy="154" r="8"/>
  <text class="y" x="85" y="52">1996</text><text class="t" x="85" y="76">IEC 61334-4-41</text><text class="t" x="85" y="96">配电线报文规范</text>

  <line class="l" x1="190" y1="154" x2="190" y2="200"/><circle class="d" cx="190" cy="154" r="8"/>
  <text class="y" x="190" y="222">1997</text><text class="t" x="190" y="246">DLMS 用户协会</text><text class="t" x="190" y="266">成立</text>

  <line class="l" x1="295" y1="154" x2="295" y2="108"/><circle class="d" cx="295" cy="154" r="8"/>
  <text class="y" x="295" y="52">2002</text><text class="t" x="295" y="76">IEC 62056</text><text class="t" x="295" y="96">正式版发布</text>

  <line class="l" x1="400" y1="154" x2="400" y2="200"/><circle class="d" cx="400" cy="154" r="8"/>
  <text class="y" x="400" y="222">2009</text><text class="t" x="400" y="246">欧盟 M/441</text><text class="t" x="400" y="266">要求开放、可互操作</text>

  <line class="l" x1="505" y1="154" x2="505" y2="108"/><circle class="d" cx="505" cy="154" r="8"/>
  <text class="y" x="505" y="52">约 2010</text><text class="t" x="505" y="76">IDIS 协会成立</text><text class="t" x="505" y="96">固定对象集</text>

  <line class="l" x1="610" y1="154" x2="610" y2="200"/><circle class="d" cx="610" cy="154" r="8"/>
  <text class="y" x="610" y="222">2013 起</text><text class="t" x="610" y="246">标准族重组为</text><text class="t" x="610" y="266">现行编号</text>

  <line class="l" x1="715" y1="154" x2="715" y2="108"/><circle class="d" cx="715" cy="154" r="8"/>
  <text class="y" x="715" y="52">2023–24</text><text class="t" x="715" y="76">核心部分</text><text class="t" x="715" y="96">发布最新一代</text>

  <line class="l" x1="810" y1="154" x2="810" y2="200"/><circle class="d" cx="810" cy="154" r="8"/>
  <text class="y" x="810" y="222">2026</text><text class="t" x="810" y="246">会员 200 多家</text><text class="t" x="810" y="266">认证产品 1700 多款</text>
</svg>
